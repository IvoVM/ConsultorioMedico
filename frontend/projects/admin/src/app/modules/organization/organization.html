<h2 class="mb-6 font-serif text-2xl tracking-tight">{{ sectionLabel() }}</h2>
<screen-note
  screen="Servicios"
  loading="Estás cargando los servicios que ofrece el consultorio, como consultorios externos, vacunatorio o imágenes."
  reason="Sirven para ver qué se atiende en cada sede y para ordenar la organización."
  skip="Si no los cargás, esta lista queda vacía y no queda registrado qué ofrece la clínica."
/>
@if (error()) { <p class="mb-4 text-sm text-pulse" role="alert">{{ error() }}</p> }
@if (loading()) {
  <ui-skeleton [label]="'Cargando ' + sectionLabel().toLowerCase()" />
} @else if (section() === 'servicios') {
  <form class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end" (ngSubmit)="createService()">
    <ui-field class="sm:w-80" label="Servicio"><input name="serviceName" [(ngModel)]="serviceName" required /></ui-field>
    <div class="flex items-end"><ui-button type="submit" [loading]="saving()">Agregar servicio</ui-button></div>
  </form>
  @if (!services().length) {
    <ui-empty message="Todavía no hay servicios cargados." />
  } @else {
  <ui-table>
    <thead><tr><th>Servicio</th></tr></thead>
    <tbody>@for (service of services(); track service.id) { <tr><td>{{ service.name }}</td></tr> }</tbody>
  </ui-table>
  }
}
