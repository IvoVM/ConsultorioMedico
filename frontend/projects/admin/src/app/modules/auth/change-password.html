<main class="grid min-h-screen bg-paper text-ink lg:grid-cols-2">
  <section class="flex flex-col justify-center gap-6 px-6 py-10 sm:px-12 lg:px-16 lg:py-16">
    <p class="font-serif text-2xl text-clinic-deep">{{ clinicName() }}</p>
    <h1 class="max-w-[14ch] font-serif text-5xl leading-tight font-medium tracking-tight xl:text-6xl">Elegí una contraseña nueva</h1>
    <p class="max-w-xl text-lg leading-relaxed text-ink/75">La contraseña con la que entraste es temporal. Elegí una propia para seguir.</p>
  </section>
  <section class="flex items-center border-rule px-6 py-12 sm:px-12 lg:border-l lg:px-16">
    <form class="flex w-full max-w-md flex-col gap-5" (ngSubmit)="submit()">
      <ui-field label="Contraseña nueva"><ui-password><input name="password" type="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" /></ui-password></ui-field>
      <ui-field label="Confirmar nueva contraseña"><ui-password><input name="confirm" type="password" [(ngModel)]="confirm" required minlength="8" autocomplete="new-password" /></ui-password></ui-field>
      <p class="text-sm text-ink/65">Al menos 8 caracteres, con una mayúscula, una minúscula y un número.</p>
      @if (error()) { <p class="text-sm text-pulse" role="alert">{{ error() }}</p> }
      <ui-button type="submit" [loading]="loading()">Guardar contraseña</ui-button>
      <ui-button type="button" variant="ghost" (click)="back()">Volver al ingreso</ui-button>
    </form>
  </section>
</main>
