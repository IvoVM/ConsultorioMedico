<ui-page frame="auth">
  <div uiBrand class="brand-lockup">
    <img class="brand-logo h-20 w-20" src="logo.svg" alt="Logo del consultorio" width="80" height="80" />
    <h1 class="mt-5 font-serif text-4xl leading-none text-clinic-deep">Elegí una contraseña nueva</h1>
    <p class="mt-3 max-w-sm text-sm text-ink/70">La contraseña con la que entraste es temporal.</p>
  </div>
  <form class="auth-form max-w-md space-y-5" (ngSubmit)="submit()">
    <ui-field label="Contraseña nueva"><input name="password" type="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" /></ui-field>
    <ui-field label="Repetir contraseña"><input name="confirm" type="password" [(ngModel)]="confirm" required minlength="8" autocomplete="new-password" /></ui-field>
    <p class="text-sm text-ink/65">Al menos 8 caracteres, con una mayúscula, una minúscula y un número.</p>
    @if (error()) { <p class="text-sm text-pulse" role="alert">{{ error() }}</p> }
    <ui-button class="w-full sm:w-auto" type="submit" [loading]="loading()">Guardar contraseña</ui-button>
  </form>
</ui-page>
