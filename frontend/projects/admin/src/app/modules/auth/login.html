<main class="auth-split">
  <section class="auth-intro">
    <p class="auth-brand"><span class="brand-badge"><img src="logo.svg" alt="" /></span>{{ clinicName() }}</p>
    <h1 class="auth-title">Quiero acceder a la administración</h1>
    <div class="auth-copy">
      <p>Entrá para ordenar el consultorio: las personas, las agendas y los comprobantes.</p>
      <p>Desde acá se dan de alta los empleados y se reinicia una contraseña cuando hace falta.</p>
    </div>
  </section>
  <section class="auth-side">
    <form class="auth-card" (ngSubmit)="submit()">
      <ui-field label="Documento"><input name="username" [(ngModel)]="documentNumber" required autocomplete="username" inputmode="numeric" autocapitalize="none" spellcheck="false" /></ui-field>
      <ui-field label="Contraseña"><ui-password><input name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" /></ui-password></ui-field>
      @if (error()) { <p class="text-sm text-pulse" role="alert">{{ error() }}</p> }
      <ui-button type="submit" [loading]="loading()">Entrar</ui-button>
    </form>
  </section>
</main>
