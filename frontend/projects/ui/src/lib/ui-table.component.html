<div class="frame">
  @if (overflow()) {
    <button type="button" class="arrow" [disabled]="!canLeft()" (click)="nudge(-1)" aria-label="Ver columnas anteriores">
      <ui-icon name="chevron_left" />
    </button>
  }
  <div #scroller class="scroller">
    <table class="min-w-full border-separate border-spacing-0 text-left text-sm [&_tbody_tr]:transition-colors [&_tbody_tr]:duration-200 [&_tbody_tr:hover]:bg-paper">
      <ng-content />
    </table>
  </div>
  @if (overflow()) {
    <button type="button" class="arrow" [disabled]="!canRight()" (click)="nudge(1)" aria-label="Ver columnas siguientes">
      <ui-icon name="chevron_right" />
    </button>
  }
</div>
