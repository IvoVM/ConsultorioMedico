@if (open()) {
  <div class="backdrop-fade fixed inset-0 z-40 overflow-y-auto bg-ink/45" (click)="closed.emit()">
    <div class="flex min-h-full items-end justify-center p-4 sm:items-center" (click)="closed.emit()">
    <div
      class="dialog-pop w-full overflow-visible border border-rule bg-white p-5 sm:p-6"
      [class.max-w-3xl]="wide()"
      [class.max-w-lg]="!wide()"
      role="dialog"
      [attr.aria-label]="title()"
      (click)="$event.stopPropagation()"
    >
      <div class="mb-5 flex items-start justify-between gap-4">
        <h2 class="font-serif text-2xl tracking-tight">{{ title() }}</h2>
        <button type="button" class="modal-close" aria-label="Cerrar" (click)="closed.emit()">×</button>
      </div>
      <ng-content />
    </div>
    </div>
  </div>
}
