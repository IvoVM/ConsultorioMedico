@if (open()) {
  <div class="backdrop-fade fixed inset-0 z-50 overflow-y-auto bg-ink/40 backdrop-blur-[3px]" (click)="closed.emit()">
    <div class="flex min-h-full items-center justify-center p-4" (click)="closed.emit()">
    <div
      class="dialog-pop max-h-[calc(100vh-2rem)] w-full overflow-y-auto rounded-3xl bg-white p-5 shadow-[0_30px_80px_-30px_rgb(14_42_34/0.45)] sm:p-7"
      [class.max-w-3xl]="wide()"
      [class.max-w-lg]="!wide()"
      role="dialog"
      [attr.aria-label]="title()"
      (click)="$event.stopPropagation()"
    >
      <div class="mb-5 flex items-start justify-between gap-4">
        <h2 class="text-xl font-bold tracking-tight">{{ title() }}</h2>
        <button type="button" class="modal-close" aria-label="Cerrar" (click)="closed.emit()">×</button>
      </div>
      <ng-content />
    </div>
    </div>
  </div>
}
