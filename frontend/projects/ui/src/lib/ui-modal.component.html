@if (open()) {
  <div class="modal-backdrop backdrop-fade" (click)="closed.emit()">
    <div
      class="modal-dialog dialog-pop"
      [class.is-wide]="wide()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      (click)="$event.stopPropagation()"
    >
      <header class="modal-head" [class.is-scrolled]="scrolled()">
        <h2 class="modal-title">{{ title() }}</h2>
        <button type="button" class="modal-close" aria-label="Cerrar" (click)="closed.emit()">
          <ui-icon name="close" [size]="20" />
        </button>
      </header>
      <div class="modal-body" (scroll)="onScroll($event)">
        <ng-content />
      </div>
      <footer class="modal-foot" [class.is-floating]="!atEnd()">
        <ng-content select="[uiModalFooter]" />
      </footer>
    </div>
  </div>
}
