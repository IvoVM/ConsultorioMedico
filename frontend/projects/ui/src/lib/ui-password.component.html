<ng-content />
<button
  type="button"
  class="absolute inset-y-0 right-0 flex w-11 cursor-pointer items-center justify-center border-0 bg-transparent p-0 text-ink/55"
  (click)="toggle()"
  [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
  [attr.aria-pressed]="visible()"
>
  <ui-icon [name]="visible() ? 'visibility_off' : 'visibility'" [size]="22" />
</button>
