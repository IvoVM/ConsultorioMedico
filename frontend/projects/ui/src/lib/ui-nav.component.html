<nav class="flex flex-col gap-1" [attr.aria-label]="label()">
  @for (node of nodes(); track node.label; let index = $index) {
    @if (node.children?.length) {
      <div [class.mt-4]="index > 0">
        <button
          type="button"
          class="flex w-full cursor-pointer items-center justify-between gap-2 rounded-sm border-0 bg-transparent px-3 py-2.5 text-left text-sm text-white/75 transition duration-200 hover:bg-white/10 hover:text-white"
          [class.bg-white/10]="isOpen(node)"
          [class.font-bold]="containsCurrent(node)"
          [class.text-white]="isOpen(node) || containsCurrent(node)"
          [attr.aria-expanded]="isOpen(node)"
          (click)="toggle(node)"
        >
          <span>{{ node.label }}</span>
          <span
            class="inline-block size-1.5 shrink-0 border-r-[1.5px] border-b-[1.5px] border-current transition-transform duration-200"
            [class.rotate-45]="isOpen(node)"
            [class.-rotate-45]="!isOpen(node)"
            aria-hidden="true"
          ></span>
        </button>
        @if (isOpen(node)) {
          <div class="mt-0.5 ml-3 flex flex-col border-l border-white/15 pl-1.5">
            @for (child of node.children; track child.path) {
              <a
                class="nav-link"
                [routerLink]="child.path"
                routerLinkActive="is-current"
                [routerLinkActiveOptions]="{ exact: !!child.exact }"
              >
                {{ child.label }}
              </a>
            }
          </div>
        }
      </div>
    } @else if (node.path) {
      <a
        class="nav-link"
        [class.mt-3]="index > 0 && !!nodes()[index - 1].children?.length"
        [routerLink]="node.path"
        routerLinkActive="is-current"
        [routerLinkActiveOptions]="{ exact: !!node.exact }"
      >
        {{ node.label }}
      </a>
    }
  }
</nav>
