<main class="min-h-screen bg-paper px-6 py-10 text-ink sm:px-10 sm:py-14">
  <a [routerLink]="staff ? '/ingreso' : '/paciente'" class="text-link">Volver</a>
  <p class="mt-10 font-serif text-2xl text-clinic-deep">{{ clinicName() }}</p>
  <h1 class="mt-3 max-w-[16ch] font-serif text-4xl leading-tight font-medium tracking-tight sm:text-5xl">{{ staff ? 'Quiero acceder al sistema administrativo' : 'Tu cuenta' }}</h1>
  <p class="mt-4 max-w-[40ch] text-lg text-ink/75">
    @if (staff) {
      Entrá con el email del consultorio.
    } @else {
      Entrá para ver tus turnos, las recetas y el historial médico.
    }
  </p>
  <form class="mt-10 max-w-md space-y-5" (ngSubmit)="submit()">
    <ui-field label="Email"><input name="email" type="email" [(ngModel)]="email" required autocomplete="username" /></ui-field>
    <ui-field label="Contraseña"><input name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" /></ui-field>
    @if (error()) { <p class="text-sm text-pulse" role="alert">{{ error() }}</p> }
    <ui-button type="submit" [loading]="loading()">Entrar</ui-button>
  </form>
</main>
