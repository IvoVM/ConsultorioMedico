<section class="gate">
  <a routerLink="/paciente" class="panel patient">
    <span class="photo" style="background-image: url('fila.jpg')" aria-hidden="true"></span>
    <span class="veil" aria-hidden="true"></span>
    <span class="copy">
      <p class="clinic">{{ clinicName() }}</p>
      <h1>Soy paciente</h1>
      <p class="lead">Reservá un turno, o accedé a tus recetas y revisá tu historial médico.</p>
    </span>
  </a>
  <a routerLink="/ingreso/empleado" class="panel staff">
    <span class="photo" style="background-image: url('recepcion.jpg')" aria-hidden="true"></span>
    <span class="veil" aria-hidden="true"></span>
    <span class="copy">
      <p class="role">Empleado</p>
      <h1>Quiero acceder al sistema administrativo</h1>
    </span>
  </a>
</section>
