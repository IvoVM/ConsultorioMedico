<section class="gate" [class.is-patient]="chosen() === 'patient'" [class.is-staff]="chosen() === 'staff'">
  <a class="panel patient" href="/reservar" (click)="open('patient', $event)">
    <span class="photo" style="background-image: url('fila.jpg')" aria-hidden="true"></span>
    <span class="veil" aria-hidden="true"></span>
    <span class="copy">
      <p class="clinic">{{ clinicName() }}</p>
      <h1>Soy paciente</h1>
      <p class="lead">Reservá un turno.</p>
    </span>
  </a>
  <a class="panel staff" href="/ingreso/empleado" (click)="open('staff', $event)">
    <span class="photo" style="background-image: url('recepcion.jpg')" aria-hidden="true"></span>
    <span class="veil" aria-hidden="true"></span>
    <span class="copy">
      <h1>SOY EMPLEADO</h1>
      <p class="lead">accedé al sistema administrativo.</p>
    </span>
  </a>
</section>
