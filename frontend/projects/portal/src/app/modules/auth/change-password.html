<main class="auth-split">
  <section class="auth-intro">
    <p class="auth-brand"><span class="brand-badge"><img src="logo.svg" alt="" /></span>{{ clinicName() }}</p>
    <h1 class="auth-title">Elegí una contraseña nueva</h1>
    <p class="max-w-xl text-lg leading-relaxed text-ink/75">La contraseña con la que entraste es temporal. Elegí una propia para seguir.</p>
  </section>
  <section class="auth-side">
    <form class="auth-card" (ngSubmit)="submit()">
      <ui-field label="Contraseña nueva">
        <ui-password><input name="password" type="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" /></ui-password>
      </ui-field>
      <ui-field label="Confirmar nueva contraseña">
        <ui-password><input name="confirm" type="password" [(ngModel)]="confirm" required minlength="8" autocomplete="new-password" /></ui-password>
      </ui-field>
      <p class="text-sm text-ink/65">Al menos 8 caracteres, con una mayúscula, una minúscula y un número.</p>
      @if (error()) { <p class="text-sm text-pulse" role="alert">{{ error() }}</p> }
      <ui-button type="submit" [loading]="loading()">Guardar contraseña</ui-button>
      <ui-button type="button" variant="ghost" (click)="back()">Volver al ingreso</ui-button>
    </form>
  </section>
</main>
