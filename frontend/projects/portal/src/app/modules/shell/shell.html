@if (session.token()) {
  <ui-page frame="shell" eyebrow="Portal" [title]="session.name() ?? 'Paciente'">
    <div uiNav class="flex h-full min-h-0 flex-col">
      <ui-nav class="min-h-0 flex-1 overflow-y-auto" label="Portal" [nodes]="menu()" />
      <ui-button class="mt-4 w-full shrink-0" variant="ghost" (click)="logout()"><ui-icon name="logout" />Salir</ui-button>
    </div>
    <router-outlet />
  </ui-page>
} @else {
  <div class="min-h-screen bg-paper text-ink">
    <header class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3 border-b border-rule px-5 py-4 sm:px-8">
      <a routerLink="/ingreso" class="flex items-center gap-3 text-ink no-underline">
        <img src="logo.svg" alt="" class="h-11 w-11" />
        <span class="font-serif text-2xl leading-none text-clinic-deep">{{ clinicName() }}</span>
      </a>
      <p class="max-w-[42ch] text-ink/80 sm:text-right">
        Para ver tu historia clínica, las recetas y tus turnos, podés
        <a routerLink="/registro" class="text-link">crear una cuenta</a>
        o <a routerLink="/ingreso/cuenta" class="text-link">entrar</a>.
      </p>
    </header>
    <main class="mx-auto w-full max-w-6xl px-5 py-8 sm:px-8">
      <router-outlet />
    </main>
  </div>
}
