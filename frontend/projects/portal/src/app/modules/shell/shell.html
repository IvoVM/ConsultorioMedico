@if (session.token()) {
  <ui-page
    frame="shell"
    [brand]="clinicName()"
    eyebrow="Portal"
    [title]="session.name() ?? 'Paciente'"
    [userName]="session.name() ?? 'Paciente'"
    [userRole]="roleText()"
    (logout)="logout()"
  >
    <ui-nav uiNav class="min-h-0 flex-1 overflow-y-auto" label="Portal" [nodes]="menu()" />
    <router-outlet />
  </ui-page>
} @else {
  <div class="min-h-screen bg-paper text-ink">
    <header class="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-x-6 gap-y-3 bg-paper/80 px-5 py-4 backdrop-blur-md sm:px-8">
      <a [routerLink]="route.Ingreso" class="flex items-center gap-3 text-ink no-underline">
        <span class="brand-badge"><img src="logo.svg" alt="" /></span>
        <span class="text-xl leading-none font-bold tracking-tight text-forest">{{ clinicName() }}</span>
      </a>
      <p class="max-w-[46ch] text-sm text-ink/70 sm:text-right">
        Para ver tu historia clínica, las recetas y tus turnos, podés
        <a [routerLink]="route.Registro" class="text-link">crear una cuenta</a>
        o <a [routerLink]="route.IngresoCuenta" class="text-link">entrar</a>.
      </p>
    </header>
    <main class="mx-auto w-full max-w-6xl px-5 py-8 sm:px-8">
      <router-outlet />
    </main>
  </div>
}
